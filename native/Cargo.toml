[package]
name = "wow-chat-translator"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jorge Luis Bustamante Jara"]
description = "Native companion app for the WoW chat translator addon"

[lib]
name = "wow_chat_translator"
path = "src/lib.rs"

[dependencies]
emojis = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Cryptography"] }
